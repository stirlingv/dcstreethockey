{% extends 'core/base.html' %}
{% load static %}
{% load helpers %}

{% block extra_head %}
<link rel="stylesheet" href="{% static 'assets/css/schedule.css' %}">
{% endblock %}

{% block content %}
<div id="content-wrapper" class="schedule">
	<div id="content">
		<div class="container">
            <div class="title">
                Schedule
            </div>
            <p class="record-legend">Team records: W-OTW-OTL-L <span class="record-legend-note">(seasons before 2022: W-L-T)</span></p>

			<div class="pill-group" id="divisionFilter">
				<button type="button" class="pill-item activeoption" data-division="all" onclick="filterSchedule('all')">All</button>
				<button type="button" class="pill-item" data-division="Monday A League" onclick="filterSchedule('Monday A League')">Monday A</button>
				<button type="button" class="pill-item" data-division="Monday B League" onclick="filterSchedule('Monday B League')">Monday B</button>
				<button type="button" class="pill-item" data-division="Sunday D1" onclick="filterSchedule('Sunday D1')">Sunday D1</button>
				<button type="button" class="pill-item" data-division="Sunday D2" onclick="filterSchedule('Sunday D2')">Sunday D2</button>
				<button type="button" class="pill-item" data-division="Wednesday Draft League" onclick="filterSchedule('Wednesday')">Wednesday</button>
			</div>
            {% include 'partials/schedule.html' %}
		</div>
	</div>
</div>

<script type="text/javascript">
		function handleSelect(elm){
	  	window.location = elm.value;
	  }
	function filterSchedule(division) {
		// Update active pill state
		var buttons = document.querySelectorAll('#divisionFilter .pill-item');
		buttons.forEach(function(btn) {
			btn.classList.remove('activeoption');
			if (btn.getAttribute('data-division') === division ||
			    (division === 'Wednesday' && btn.getAttribute('data-division') === 'Wednesday Draft League')) {
				btn.classList.add('activeoption');
			}
		});

		// Filter schedule sections
		var sections = document.querySelectorAll('.schedule-section');
		sections.forEach(function(section) {
			var sectionDivision = section.getAttribute('data-division');
			if (division === 'all') {
				section.style.display = 'block';
			} else if (division === 'Wednesday') {
				// Match any division containing "Wednesday"
				section.style.display = sectionDivision.includes('Wednesday') ? 'block' : 'none';
			} else {
				section.style.display = sectionDivision === division ? 'block' : 'none';
			}
		});
	}
</script>
{% endblock %}

{% block extra_scripts %}
<script src="{% static 'assets/js/odds.js' %}"></script>
{% endblock %}
