name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly, so a newly published advisory is caught even without a PR.
    - cron: '0 13 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Set up environment variables
      run: |
        echo "DEBUG=True" >> $GITHUB_ENV
        echo "DATABASE_URL=postgres://postgres:postgres@localhost/test_db" >> $GITHUB_ENV
        echo "SECRET_KEY=test-secret-key-for-github-actions" >> $GITHUB_ENV
        echo "DJANGO_SETTINGS_MODULE=dcstreethockey.settings.local" >> $GITHUB_ENV

    - name: Run Django system checks
      run: |
        python manage.py check

    - name: Check for pending migrations
      run: |
        python manage.py makemigrations --check --dry-run

    - name: Run tests
      run: |
        python manage.py test

    - name: Run comprehensive test suite
      run: |
        python manage.py test core.tests.test_standings core.tests.test_player_stats -v 2

    - name: Run pre-commit hooks
      run: |
        pre-commit run --all-files

  production-smoke:
    # Boot the site the way Render does and crawl every page, admin included.
    # Installs production packages only, so a removed dependency that is still
    # needed fails here instead of on the live site.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smoke_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11 (matches Render)
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install production dependencies only
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run production smoke test
      env:
        DATABASE_URL: postgres://postgres:postgres@localhost:5432/smoke_db
      run: scripts/run_production_smoke.sh

  dependency-audit:
    # Audits every installed package, including sub-dependencies that
    # requirements.txt doesn't pin (Dependabot only sees pinned ones).
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install production dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Audit for known vulnerabilities
      # Ignored advisories (remove each once a fixed release can be installed):
      # twisted 26.4.0: the only fix so far is the 26.10.0rc1 pre-release,
      # which production shouldn't pin. Twisted is installed only because
      # daphne needs it; production serves through uvicorn, and the site runs
      # none of the affected Twisted servers.
      # - CVE-2026-106454: ReDoS in twisted.mail.imap4 wildcard handling.
      # - CVE-2026-115774: infinite loop in the twisted.mail.imap4 server.
      # - CVE-2026-115775: unbounded XML element tree in twisted.words.xish.
      # - CVE-2026-115776: unbounded line buffer in the twisted.words IRC server.
      # - CVE-2026-115778: unbounded telnet subnegotiation buffer in twisted.conch.
      # - CVE-2026-115877: bare CR/LF in a header value accepted by the
      #   twisted.web HTTP server, which only serves `manage.py runserver` here.
      run: |
        SITE=$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
        pipx run pip-audit --path "$SITE" --desc on \
          --ignore-vuln CVE-2026-106454 \
          --ignore-vuln CVE-2026-115774 \
          --ignore-vuln CVE-2026-115775 \
          --ignore-vuln CVE-2026-115776 \
          --ignore-vuln CVE-2026-115778 \
          --ignore-vuln CVE-2026-115877
